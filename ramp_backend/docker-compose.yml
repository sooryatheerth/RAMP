services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ramp_db
      POSTGRES_USER: ramp_user
      POSTGRES_PASSWORD: ramp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
